<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI 실시간 환승 가이드</title>
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=2yf7379v3p"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background: #f8f9fa; }
        #map { width: 100%; height: 400px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .result-card { background: white; margin-top: 15px; padding: 20px; border-radius: 15px; }
        .btn { width: 100%; padding: 15px; background: #0084ff; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="result-card">
        <h3 id="info-title">📍 목적지: 성수역</h3>
        <p id="info-subway">지하철 정보: -</p>
        <p id="info-move">도보 예상: -</p>
        <button class="btn" onclick="fetchRoute()">실시간 경로 예측 시작</button>
    </div>

    <script>
        // 지도 초기화
        var map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(37.5445, 127.0560),
            zoom: 15
        });

        function fetchRoute() {
            // 실제 사용자 위치(성수역 인근 좌표 예시)
            const lat = 37.5480; 
            const lon = 127.0500;

            fetch(`/get_status?lat=${lat}&lon=${lon}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('info-subway').innerText = "🚇 " + data.subway;
                    document.getElementById('info-move').innerText = "🏃 " + data.message;
                    alert("데이터 분석 완료!");
                });
        }
    </script>
</body>
</html>
